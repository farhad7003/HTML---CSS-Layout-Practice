<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive sign-in form built with HTML and CSS.">
    <title>Responsive Sign In Form | HTML & CSS Practice</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="container">
        <div class="drop">
            <div class="content">
                <h1>Sign in</h1>
                <form>
                    <div class="input-box">
                        <input type="text" placeholder="User Name" aria-label="User Name">
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Password" aria-label="Password">
                    </div>
                    <div class="input-box">
                        <input type="submit" value="Login">
                    </div>
                </form>
            </div>
        </div>
        <a href="#" class="btn">Forgot password</a>
        <a href="#" class="btn signup">Sign Up</a>
    </main>
</body>
</html>
